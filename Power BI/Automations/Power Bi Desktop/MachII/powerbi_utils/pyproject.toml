[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powerbi-utils"
version = "0.1.0"
description = "Power BI automation utilities and helpers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name="Narendra Dasari"}]

dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.25.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
pb-schema-gen = "powerbi_utils.cli:main"