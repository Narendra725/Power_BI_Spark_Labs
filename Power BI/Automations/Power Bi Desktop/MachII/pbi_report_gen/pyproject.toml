[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbi-automation"
version = "0.1.0"
description = "Power BI report definition automation using JSON artifacts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name="Narendra Dasari"}]

dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
